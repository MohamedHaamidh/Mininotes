<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MiniNotes</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="brand">
          <h1>MiniNotes</h1>
          <p class="tagline">A quiet place for short notes.</p>
        </div>
        <button type="button" id="theme-toggle" aria-pressed="false">
          Dark mode
        </button>
      </header>

      <main class="workspace">
        <section id="home-view" class="view" aria-label="Saved notes">
          <div class="view-bar">
            <div>
              <p class="eyebrow">Homepage</p>
              <h2>Saved notes</h2>
            </div>
            <button type="button" id="new-note" class="primary">New Note</button>
          </div>

          <ul id="note-list" class="note-list"></ul>

          <div id="empty-state" class="empty-state" hidden>
            <div class="empty-art" aria-hidden="true">
              <svg viewBox="0 0 80 80" width="80" height="80">
                <rect x="18" y="12" width="44" height="56" rx="8"></rect>
                <path d="M30 30h20M30 40h20M30 50h12"></path>
              </svg>
            </div>
            <h2>No notes yet</h2>
            <p>Start with a blank note. It saves on its own.</p>
            <button type="button" id="empty-new-note" class="primary">New Note</button>
          </div>
        </section>

        <section id="editor-view" class="view" aria-label="Note editor" hidden>
          <form id="editor-form" class="editor-form">
            <div class="editor-toolbar">
              <button type="button" id="back-button">Back</button>
              <p id="save-status" class="save-status" aria-live="polite">Saved</p>
              <button type="button" id="delete-note" class="danger">Delete</button>
            </div>
            <label class="field">
              <span class="field-label">Title</span>
              <input
                id="note-title"
                type="text"
                maxlength="120"
                placeholder="Untitled"
                autocomplete="off"
              />
            </label>
            <label class="field field-body">
              <span class="field-label">Note</span>
              <textarea id="note-body" placeholder="Write something…"></textarea>
            </label>
          </form>
        </section>
      </main>
    </div>
  </body>
</html>
